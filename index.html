<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Фитнес Дома</title>
  </head>
  <body>
    <!-- Шапка -->
    <header>
      <h1>ФитнесДома</h1>
      <p>Ваш персональный гид по тренировкам с собственным весом</p>
      <img
        src="img\i (2).webp"
        alt="Человек тренируется дома на коврике"
        width="720"
        height="470"
      />
      <nav>
        <ul>
          <li><a href="lb_1.2.html">Разбор ошибок</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- Секция выбора программ по времени -->
      <section class="tabs-section">
        <h2>Выберите длительность тренировки:</h2>
        <p>У вас есть немного времени? Выберите подходящий тайминг:</p>

        <div class="tabs">
          <a href="lb_1.3.html" target="_blank">
            <button class="tab-btn">15 минут (Экспресс)</button>
          </a>

          <a href="lb_1.4.html" target="_blank">
            <button class="tab-btn">30 минут (Стандарт)</button>
          </a>
          <a href="lb_1.5.html" target="_blank">
            <button class="tab-btn">45 минут (Интенсив)</button>
          </a>
        </div>
      </section>

      <!-- Прогресс-трекер -->
      <section class="tracker-section">
        <h2>Ваш прогресс за сегодня</h2>
        <form action="#" method="POST">
          <div>
            <label for="workout-type">Тип тренировки:</label>
            <select id="workout-type" name="workout-type">
              <option value="15">Экспресс (15 мин)</option>
              <option value="30">Стандарт (30 мин)</option>
              <option value="45">Интенсив (45 мин)</option>
            </select>
          </div>
          <div>
            <label for="feeling">Самочувствие (от 1 до 5):</label>
            <input
              type="number"
              id="feeling"
              name="feeling"
              min="1"
              max="5"
              placeholder="5"
            />
          </div>
          <div>
            <label for="notes">Заметки:</label>
            <textarea
              id="notes"
              name="notes"
              placeholder="Как прошли отжимания?"
            ></textarea>
          </div>
          <button type="submit">Записать тренировку</button>
        </form>
      </section>
    </main>

    <footer>
      <p>
        &copy; 2026 Фитнес Дома. Все тренировки разработаны для выполнения без
        инвентаря.
      </p>
    </footer>
  </body>
</html>
